name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Tests del motor de cálculo
        run: npm test

      - name: Preparar la web de la app
        run: node scripts/build-web.js www

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ícono y pantalla de inicio
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Número de versión
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || { echo "::error title=Compilación falló::Gradle no pudo compilar el APK."; exit 1; }

      - name: Firmar APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error title=Falta la clave de firma::Agrega los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD en Settings > Secrets and variables > Actions, y vuelve a ejecutar este flujo."
            exit 1
          fi
          # Quitar espacios o saltos de línea que se cuelan al copiar y pegar
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          export KS_PASS
          if ! printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > ks.p12 2>/dev/null; then
            echo "::error title=Clave mal copiada::ANDROID_KEYSTORE_BASE64 no es válido. Vuelve a pegar la línea larga completa del SECRETO 2."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore ks.p12 -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error title=Contraseña incorrecta::ANDROID_KEYSTORE_PASSWORD no coincide con la clave. Vuelve a pegar el valor del SECRETO 1 (24 letras y números)."
            exit 1
          fi
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error title=No se generó el APK::No hay APK en android/app/build/outputs/apk/release."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "::notice::APK sin firmar: $UNSIGNED · build-tools: $BT"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk || { echo "::error title=zipalign falló::$UNSIGNED"; exit 1; }
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias ahorra --out AHORRA-plus.apk aligned.apk \
            || { echo "::error title=apksigner falló::No se pudo firmar el APK."; exit 1; }
          "$BT/apksigner" verify AHORRA-plus.apk || { echo "::error title=Firma inválida::apksigner verify falló."; exit 1; }
          rm -f ks.p12 aligned.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AHORRA+ 1.0.${{ github.run_number }}
          make_latest: true
          files: AHORRA-plus.apk
          body: |
            **Descargar:** toca `AHORRA-plus.apk` abajo, en *Assets*.

            Para instalar en Android: abre el archivo descargado y, si el celular lo pide, permite "instalar apps desconocidas" para tu navegador o gestor de archivos.
            Si ya tenías AHORRA+, esta versión se instala encima y conserva tus datos.
